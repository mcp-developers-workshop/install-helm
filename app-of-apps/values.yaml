    repoUrl: https://github.com/mcp-developers-workshop/install-helm.git
    targetRevision: main
    path: globex-store-mcp-build
    helm:
      values:
        gitlab:
          namespace: gitlab
          tokenSecret: root-user-personal-token
          host:
          group: globex
          repo: globex-store-mcp
          branch: main
          webhookSecret:
        cluster:
          subdomain:
        image:
          registry: OpenShift
          organization: ""
          host: image-registry.openshift-image-registry.svc:5000
