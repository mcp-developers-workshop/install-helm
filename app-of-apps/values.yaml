  applicationNamespace: openshift-gitops
  destinationNamespace: quay
  source:
    repoUrl: https://github.com/mcp-developers-workshop/install-helm.git
    targetRevision: main
    path: quay
    helm:
      values:
        quay-registry:
          quay:
            host: 
            adminUser: admin
            adminUserPassword: 
            organizations:
          noobaa:
            name: noobaa
            namespace: openshift-storage

  argocd:
    enabled: true
    syncwave: "2"

