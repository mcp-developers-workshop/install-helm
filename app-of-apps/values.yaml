        noobaa:
          nameOverride: noobaa

  argocd:
    enabled: true
    syncwave: "1"

vault:
  enabled: false
  applicationName: vault
  applicationNamespace: openshift-gitops
  destinationNamespace: vault
  source:
    repoUrl: https://github.com/mcp-developers-workshop/install-helm.git
    targetRevision: main
    path: vault
    helm:
      values:
        nameOverride: vault
        kubernetes:
          apiserver:
        vault:
          auth:
            namespace: default

  argocd:
    enabled: true
    syncwave: "1"

quay:
  enabled: false
