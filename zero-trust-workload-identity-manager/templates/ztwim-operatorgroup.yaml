apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .Values.subscription.name }}
  namespace: {{ include "ztwim.namespace" . }}
  labels:
    {{- include "ztwim.labels" . | nindent 4 }}
  annotations:
    {{- include "ztwim-operatorgroup.argocd-syncwave" . | nindent 4 }}
spec:
  # No targetNamespaces: the operator watches all namespaces. Its custom resources are
  # cluster scoped and the SPIRE agent runs on every node.
  upgradeStrategy: Default
