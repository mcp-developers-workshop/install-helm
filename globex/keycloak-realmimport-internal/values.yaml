namespace: keycloak

keycloak:
  name: keycloak

realm:
  name: internal

hook:
  image:
    repository: quay.io/cloud-architecture-workshop/wait-for-statefulset-job
    pullPolicy: IfNotPresent
    tag: "1c68180"
  serviceAccount:
    create: true
    name: ""
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  maxTimeToWait: 120000

clients:
  complaintsClient:
    id:
    secret:
  mcpClient:
    id:
    secret:
    scope:
  mcpServer:
    id:
    secret:
    scope:
  mcpService:
    id:
    secret:
    scope:
  # The agent's SPIFFE-authenticated client. Authenticates with an SVID issued by SPIRE
  # instead of a client secret, so the secret below is only a placeholder the realm
  # import requires. spiffeId must match the workload's SVID exactly.
  agentSpiffe:
    id: globex-agent-spiffe
    secret:
    spiffeId:

# Adds the SPIFFE identity provider and the federated client to the realm. Disable to
# get a plain OIDC realm with client-secret authentication only.
spiffe:
  enabled: true
  trustDomain: globex.com
  bundleEndpoint:
  providerId: spiffe

groups: []

roles: []

argocd:
  enabled: true
  syncwave: "-2"

